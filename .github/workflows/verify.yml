name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KAGE smoke suite
        run: bash scripts/ci_smoke.sh
      - name: Stdlib-only check
        run: '! grep -E "^[[:space:]]*(import|from)[[:space:]]+(requests|flask|httpx|aiohttp|urllib3)" scripts/kage.py'
